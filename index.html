<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>平板規格比較表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#17202d;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1200px;margin:42px auto;padding:0 22px}h1{font-size:25px;margin:0 0 8px}.hint{color:#677386;font-size:14px;margin:0 0 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}input{border:1px solid #d9dee7;border-radius:9px;padding:11px 14px;font:inherit;width:min(330px,100%);background:#fff}#count{font-size:13px;color:#697588}.tablewrap{border:1px solid #e1e5eb;border-radius:12px;background:white;overflow-x:auto;box-shadow:0 3px 14px #18253a0a}table{border-collapse:collapse;width:100%;min-width:850px;font-size:14px}th{white-space:nowrap;text-align:left;background:#f0f3f7;padding:0;border-bottom:1px solid #dfe4ea}th button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:15px 13px;color:#263449;background:none;border:0;font:inherit;font-weight:700;cursor:pointer}th button:hover{background:#e7ebf1}.arrow{color:#8895a5;font-size:12px}td{padding:14px 13px;border-bottom:1px solid #edf0f4;vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:#fafbfd}a{color:#255db2;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}.empty{text-align:center;color:#758195;padding:40px}
</style></head><body><main class="wrap"><h1>平板規格比較表</h1><p class="hint">點選任一欄標題即可排序，再點一次切換反向排序。</p><div class="toolbar"><input id="search" type="search" placeholder="搜尋品牌、型號、規格…" aria-label="搜尋表格"><span id="count"></span></div><div class="tablewrap"><table><thead><tr id="header"></tr></thead><tbody id="body"></tbody></table></div></main><script>
const headers=["品牌", "年份", "型號", "螢幕尺寸", "容量規格", "顏色", "官網價格", "購買頁"];
const data=[["小米", "2026", "Xiaomi Pad 9", "11.2吋", "8GB+128GB", "銀、綠、黑、粉", "¥2,999", {"text": "商品頁", "url": "https://www.mi.com/shop/buy/detail?product_id=25446"}], ["VIVO", "2026", "vivo Pad SE 2s", "12.3吋", "6GB+128GB", "深灰、藍", "¥1,699", {"text": "商品頁", "url": "https://shop.vivo.com.cn/product/10069388?skuId=257917"}], ["小米", "2025", "REDMI Pad 2", "11吋", "8GB+128GB", "青、灰、紫", "¥1,599", {"text": "商品頁", "url": "https://www.mi.com/shop/buy/detail?product_id=21591"}], ["小米", "2024", "REDMI Pad Pro", "12.1吋", "6GB+128GB", "藍、深灰", "¥1,499", {"text": "商品頁", "url": "https://www.mi.com/shop/buy/detail?product_id=19820&cfrom=search"}], ["VIVO", "2025", "vivo Pad SE", "12.3吋", "6GB+128GB", "深灰、鈦色", "¥1,499", {"text": "商品頁", "url": "https://shop.vivo.com.cn/product/10010883?skuId=137943"}], ["荣耀", "2026", "X10", "11吋", "6GB+128GB", "青、灰", "¥1,399", {"text": "商品頁", "url": "https://www.honor.com/cn/shop/product/10086717555803.html"}], ["荣耀", "2024", "X9 Pro", "11.5吋", "6GB+128GB", "白、灰", "¥1,299", {"text": "商品頁", "url": "https://www.honor.com/cn/shop/product/10086324134538.html"}], ["台電", "2026", "T70 Pro", "14吋", "8GB+128GB", "青、灰", "¥1,271", {"text": "商品頁", "url": "https://detail.tmall.com/item.htm?id=1073520094865&skuId=6289450271147"}], ["小米", "2024", "REDMI Pad 2 SE", "9.7吋", "6GB+128GB", "銀、深灰", "¥1,099", {"text": "商品頁", "url": "https://www.mi.com/shop/buy/detail?product_id=1230807222&cfrom=search"}]];
let sortCol=-1,ascending=true,keyword='';
const head=document.querySelector('#header'),body=document.querySelector('#body');
const collator=new Intl.Collator('zh-Hant',{numeric:true,sensitivity:'base'});
const textOf=x=>typeof x==='object'&&x!==null?x.text:String(x??'');
function keyOf(cell,col){const s=textOf(cell).trim();if(col===1||col===3||col===6){const n=parseFloat(s.replace(/[,，]/g,'').replace(/^[^0-9.-]*/,''));return Number.isFinite(n)?n:s;}return s;}
function render(){head.replaceChildren();headers.forEach((h,i)=>{const th=document.createElement('th'),btn=document.createElement('button'),name=document.createElement('span'),arrow=document.createElement('span');name.textContent=h;arrow.className='arrow';arrow.textContent=sortCol===i?(ascending?'▲':'▼'):'↕';btn.append(name,arrow);btn.addEventListener('click',()=>{ascending=sortCol===i?!ascending:true;sortCol=i;render()});th.append(btn);head.append(th)});
 const filtered=data.map((r,i)=>({r,i})).filter(({r})=>r.some(c=>textOf(c).toLocaleLowerCase().includes(keyword)));
 if(sortCol>=0)filtered.sort((a,b)=>{const x=keyOf(a.r[sortCol],sortCol),y=keyOf(b.r[sortCol],sortCol);const n=typeof x==='number'&&typeof y==='number'?x-y:collator.compare(String(x),String(y));return (ascending?1:-1)*n||a.i-b.i});
 body.replaceChildren();for(const {r} of filtered){const tr=document.createElement('tr');for(const cell of r){const td=document.createElement('td');if(typeof cell==='object'&&cell?.url){const a=document.createElement('a');a.href=cell.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=cell.text;td.append(a)}else td.textContent=textOf(cell);tr.append(td)}body.append(tr)}if(!filtered.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=headers.length;td.className='empty';td.textContent='沒有符合的資料';tr.append(td);body.append(tr)}document.querySelector('#count').textContent=`顯示 ${filtered.length} / ${data.length} 筆`;}
document.querySelector('#search').addEventListener('input',e=>{keyword=e.target.value.trim().toLocaleLowerCase();render()});render();
</script></body></html>
